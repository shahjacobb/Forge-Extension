<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lahza — Field</title>
    <style>
      html,
      body {
        margin: 0;
        background: #4f4a43;
      }

      .artboard {
        width: 1600px;
        height: 720px;
        background:
          radial-gradient(ellipse at 18% 20%, rgba(196, 168, 124, 0.12), transparent 42%),
          linear-gradient(180deg, #5a554c 0%, #4c4740 100%);
        color: #e6dccb;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        overflow: hidden;
        position: relative;
        font-family: "Noto Serif", "Liberation Serif", Georgia, serif;
      }

      .copy {
        padding: 88px 56px 80px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .kicker {
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #c4b49a;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-family: "Noto Serif Display", "Noto Serif", Georgia, serif;
        font-size: 108px;
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 0.82;
        color: #f1e6d2;
      }

      .arabic {
        display: block;
        margin-top: 14px;
        font-family: "Noto Naskh Arabic", serif;
        font-size: 40px;
        color: #d2c2a6;
        line-height: 1;
      }

      .lede {
        margin: 32px 0 0;
        max-width: 540px;
        font-size: 23px;
        line-height: 1.45;
        color: #d8ccb8;
      }

      .said {
        margin: 18px 0 0;
        max-width: 520px;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #b7aa96;
      }

      .stage {
        display: grid;
        place-items: center;
      }

      .device {
        width: 300px;
        height: 500px;
        background: #3f3b35;
        border: 1px solid #6a6358;
        border-radius: 26px;
        padding: 26px 22px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        box-shadow: 0 30px 80px rgba(20, 16, 10, 0.35);
      }

      .device-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        color: #cbbfaa;
        font-family: "Source Sans 3", sans-serif;
        font-size: 13px;
      }

      .ring {
        width: 196px;
        height: 196px;
        border-radius: 50%;
        background: conic-gradient(#e2d3b6 0 80deg, #5a554c 80deg 360deg);
        mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      }

      .time {
        margin-top: -138px;
        text-align: center;
      }

      .time small {
        display: block;
        font-family: "Source Sans 3", sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a89882;
        font-size: 11px;
        margin-bottom: 8px;
      }

      .time strong {
        font-family: "DejaVu Sans Mono", ui-monospace, monospace;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: -0.06em;
        color: #f1e6d2;
      }

      .cta {
        margin-top: auto;
        width: 100%;
        background: #e2d3b6;
        color: #3a342c;
        border-radius: 10px;
        text-align: center;
        padding: 13px 12px;
        font-family: "Source Sans 3", sans-serif;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="artboard">
      <div class="copy">
        <div class="kicker">A focus timer for Chrome</div>
        <h1>Lahza</h1>
        <span class="arabic" lang="ar" dir="rtl">لحظة</span>
        <p class="lede">Keep the hour. Rest a little. After four, a longer pause.</p>
        <p class="said">Said <em>LAH-zah</em>. Arabic for a moment — the span you are actually in.</p>
      </div>
      <div class="stage">
        <div class="device">
          <div class="device-top">
            <span>Lahza</span>
            <span>Focus</span>
          </div>
          <div class="ring"></div>
          <div class="time">
            <small>Focus</small>
            <strong>24:12</strong>
          </div>
          <div class="cta">Start focus</div>
        </div>
      </div>
    </div>
  </body>
</html>
