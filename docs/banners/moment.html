<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sukoon</title>
    <style>
      html,
      body {
        margin: 0;
        background: #58564f;
      }

      .artboard {
        width: 1600px;
        height: 720px;
        background:
          radial-gradient(circle at 74% 46%, rgba(201, 195, 180, 0.1), transparent 38%),
          #58564f;
        color: #d4d1c8;
        overflow: hidden;
        position: relative;
        font-family: "Noto Serif", Georgia, serif;
      }

      .arabic {
        position: absolute;
        right: 48px;
        top: 50%;
        transform: translateY(-52%);
        font-family: "Noto Kufi Arabic", "Noto Naskh Arabic", serif;
        font-size: 360px;
        line-height: 0.8;
        color: rgba(212, 209, 200, 0.16);
        pointer-events: none;
      }

      .copy {
        position: relative;
        z-index: 1;
        height: 720px;
        padding: 88px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 900px;
      }

      .kicker {
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c9c3b4;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-family: "Noto Serif Display", "Noto Serif", Georgia, serif;
        font-size: 96px;
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 0.9;
        color: #d4d1c8;
      }

      .word {
        margin-top: 12px;
        font-family: "Noto Naskh Arabic", serif;
        font-size: 44px;
        color: #c9c3b4;
      }

      .lede {
        margin: 32px 0 0;
        max-width: 560px;
        font-size: 26px;
        line-height: 1.4;
        color: #d4d1c8;
      }

      .lede strong {
        font-weight: 600;
      }

      .foot {
        margin-top: 36px;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: #b3b0a6;
      }
    </style>
  </head>
  <body>
    <div class="artboard">
      <div class="arabic" lang="ar" dir="rtl">سكون</div>
      <div class="copy">
        <div class="kicker">A focus timer for Chrome</div>
        <h1>Sukoon</h1>
        <div class="word" lang="ar" dir="rtl">سكون</div>
        <p class="lede">
          <strong>Focus sessions for deep work.</strong>
          A block in the toolbar, a short rest, a longer pause after four.
        </p>
        <p class="foot">Said soo-KOON · Arabic for stillness</p>
      </div>
    </div>
  </body>
</html>
