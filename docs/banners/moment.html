<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sukoon</title>
    <style>
      @font-face {
        font-family: "Geist Mono";
        src: url("./fonts/GeistMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("./fonts/GeistMono-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("./fonts/GeistMono-SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        margin: 0;
        background: #58564f;
      }

      .artboard {
        width: 1600px;
        height: 720px;
        background: #58564f;
        color: #d4d1c8;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        overflow: hidden;
        position: relative;
        font-family: "Geist Mono", ui-monospace, monospace;
      }

      .mark {
        position: absolute;
        left: 56px;
        top: 50%;
        transform: translateY(-48%);
        font-family: "Noto Kufi Arabic", "Noto Naskh Arabic", serif;
        font-size: 240px;
        line-height: 0.85;
        color: #edb48c;
        opacity: 0.72;
        pointer-events: none;
        z-index: 0;
      }

      .copy,
      .stage {
        position: relative;
        z-index: 1;
      }

      .copy {
        padding: 88px 48px 80px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .kicker {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #d4d1c8;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 0.9;
        color: #e8e4dc;
      }

      .arabic {
        margin-top: 12px;
        font-family: "Noto Naskh Arabic", serif;
        font-size: 30px;
        color: #edb48c;
      }

      .lede {
        margin: 28px 0 0;
        max-width: 540px;
        font-size: 20px;
        font-weight: 400;
        line-height: 1.5;
        color: #d4d1c8;
      }

      .pills {
        display: flex;
        gap: 10px;
        margin-top: 36px;
      }

      .pills span {
        border: 1px solid #706e65;
        background: #64625a;
        color: #d4d1c8;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .stage {
        display: grid;
        place-items: center;
      }

      .device {
        width: 300px;
        height: 500px;
        background: #5e5c55;
        border: 1px solid #706e65;
        border-radius: 26px;
        padding: 26px 22px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        box-shadow: 0 24px 60px rgba(28, 26, 22, 0.28);
      }

      .device-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        color: #b3b0a6;
        font-size: 13px;
      }

      .ring {
        width: 196px;
        height: 196px;
        border-radius: 50%;
        background: conic-gradient(#c9c3b4 0 80deg, #6a685f 80deg 360deg);
        mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      }

      .time {
        margin-top: -138px;
        text-align: center;
      }

      .time small {
        display: block;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #918e84;
        font-size: 11px;
        margin-bottom: 8px;
      }

      .time strong {
        font-size: 44px;
        font-weight: 500;
        letter-spacing: -0.06em;
        color: #d4d1c8;
      }

      .cta {
        margin-top: auto;
        width: 100%;
        background: #c9c3b4;
        color: #3c3b36;
        border-radius: 10px;
        text-align: center;
        padding: 13px 12px;
        font-size: 15px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="artboard">
      <div class="mark" lang="ar" dir="rtl" aria-hidden="true">سكون</div>
      <div class="copy">
        <div class="kicker">A Chrome timer for focus sessions</div>
        <h1>Sukoon</h1>
        <div class="arabic" lang="ar" dir="rtl">سكون</div>
        <p class="lede">
          A Pomodoro timer for Chrome. Work 25 minutes, rest 5. After four sessions, take a longer break.
        </p>
        <div class="pills">
          <span>Focus</span>
          <span>Break</span>
          <span>Long break</span>
        </div>
      </div>
      <div class="stage">
        <div class="device">
          <div class="device-top">
            <span>Sukoon</span>
            <span>Focus</span>
          </div>
          <div class="ring"></div>
          <div class="time">
            <small>Focus</small>
            <strong>24:12</strong>
          </div>
          <div class="cta">Start focus</div>
        </div>
      </div>
    </div>
  </body>
</html>
