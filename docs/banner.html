<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Miqat banner</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #4f4d47;
        color: #d4d1c8;
        font-family: Inter, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      }

      .artboard {
        width: 1600px;
        height: 720px;
        background: #58564f;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        overflow: hidden;
        position: relative;
      }

      .artboard::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 78% 42%, rgba(201, 195, 180, 0.08), transparent 36%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 40%);
        pointer-events: none;
      }

      .copy,
      .stage {
        position: relative;
        z-index: 1;
      }

      .copy {
        padding: 72px 64px 72px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .kicker {
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a968c;
        margin-bottom: 18px;
      }

      .name-row {
        display: flex;
        align-items: baseline;
        gap: 22px;
      }

      h1 {
        margin: 0;
        font-size: 92px;
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.9;
        color: #ddd9cf;
      }

      .arabic {
        font-family: "Noto Naskh Arabic", "Amiri", "Times New Roman", serif;
        font-size: 42px;
        color: #c9c3b4;
        letter-spacing: 0;
        line-height: 1;
      }

      p {
        margin: 26px 0 0;
        max-width: 560px;
        font-size: 22px;
        line-height: 1.45;
        color: #b3b0a6;
      }

      .pills {
        display: flex;
        gap: 10px;
        margin-top: 34px;
        flex-wrap: wrap;
      }

      .pills span {
        border: 1px solid #706e65;
        background: #64625a;
        color: #d4d1c8;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .stage {
        display: grid;
        place-items: center;
      }

      .device {
        width: 320px;
        height: 520px;
        background: #5e5c55;
        border: 1px solid #706e65;
        border-radius: 28px;
        padding: 28px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .device-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        color: #b3b0a6;
        font-size: 13px;
      }

      .ring {
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: conic-gradient(#c9c3b4 0 72deg, #6a685f 72deg 360deg);
        mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
      }

      .time {
        margin-top: -148px;
        text-align: center;
      }

      .time small {
        display: block;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #918e84;
        font-size: 11px;
        margin-bottom: 8px;
      }

      .time strong {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: -0.06em;
        color: #d4d1c8;
      }

      .cta {
        margin-top: auto;
        width: 100%;
        background: #c9c3b4;
        color: #3c3b36;
        border-radius: 10px;
        text-align: center;
        padding: 14px 12px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="artboard">
      <div class="copy">
        <div class="kicker">A focus timer for Chrome</div>
        <div class="name-row">
          <h1>Miqat</h1>
          <span class="arabic" lang="ar" dir="rtl">ميقات</span>
        </div>
        <p>
          Deep-work sessions, short breaks, a long break after four.
          A <em>miqat</em> is an appointed time — the threshold you cross when you mean to begin.
        </p>
        <div class="pills">
          <span>Focus</span>
          <span>Break</span>
          <span>Long break</span>
        </div>
      </div>
      <div class="stage">
        <div class="device">
          <div class="device-top">
            <span>Miqat</span>
            <span>Focus</span>
          </div>
          <div class="ring"></div>
          <div class="time">
            <small>Focus</small>
            <strong>24:12</strong>
          </div>
          <div class="cta">Start focus</div>
        </div>
      </div>
    </div>
  </body>
</html>
